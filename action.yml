name: "solana-upgrade-check"
description: "Flag TS/JS code and package.json entries broken or made stale by 2026 Solana upgrades (Transaction v1, SIMD-0437 rent, SIMD-0525 slot times, SNS .sol -> .sns)."
branding:
  icon: "check-circle"
  color: "purple"
inputs:
  path:
    description: "Directory or file to scan (relative to the workspace)."
    required: false
    default: "."
  fail-on:
    description: "Fail the step on: error | warning | none."
    required: false
    default: "error"
  upload-sarif:
    description: "Upload results to GitHub code scanning (needs `security-events: write`)."
    required: false
    default: "true"
  sarif-file:
    description: "Where to write the SARIF report."
    required: false
    default: "solana-upgrade-check.sarif"
  ignore:
    description: "Extra glob to ignore (single pattern)."
    required: false
    default: ""
outputs:
  sarif-file:
    description: "Path of the SARIF report."
    value: ${{ inputs.sarif-file }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install and build solana-upgrade-check
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --no-audit --no-fund
        npm run build
    - name: Scan (SARIF)
      id: scan
      shell: bash
      env:
        SUC_PATH: ${{ inputs.path }}
        SUC_SARIF: ${{ inputs.sarif-file }}
        SUC_IGNORE: ${{ inputs.ignore }}
      run: |
        extra=()
        if [ -n "$SUC_IGNORE" ]; then extra+=(--ignore "$SUC_IGNORE"); fi
        node "${{ github.action_path }}/dist/cli.js" scan "$SUC_PATH" --format sarif --output "$SUC_SARIF" --fail-on none "${extra[@]}"
    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: solana-upgrade-check
    - name: Report and gate
      shell: bash
      env:
        SUC_PATH: ${{ inputs.path }}
        SUC_FAIL_ON: ${{ inputs.fail-on }}
        SUC_IGNORE: ${{ inputs.ignore }}
      run: |
        extra=()
        if [ -n "$SUC_IGNORE" ]; then extra+=(--ignore "$SUC_IGNORE"); fi
        node "${{ github.action_path }}/dist/cli.js" scan "$SUC_PATH" --fail-on "$SUC_FAIL_ON" "${extra[@]}"
